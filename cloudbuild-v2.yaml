{
  "substitutions": {
    "_TAG": "manual"
  },
  "steps": [
    {
      "id": "build-env",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "bash",
      "args": [
        "-ec",
        "umask 077; gcloud secrets versions access latest --secret=tollbooth-v2-env > .env.staging-product; gcloud secrets versions access latest --secret=v2-db-env > .env.staging-database"
      ]
    },
    {
      "id": "merge-staging-env",
      "name": "node:24-bookworm-slim",
      "entrypoint": "node",
      "args": [
        "scripts/gcp-staging-env.mjs",
        ".env.staging-product",
        ".env.staging-database",
        ".env.production"
      ]
    },
    {
      "id": "staging-env-tests",
      "name": "node:24-bookworm-slim",
      "entrypoint": "node",
      "args": [
        "--test",
        "scripts/test-gcp-staging-env.mjs"
      ]
    },
    {
      "id": "linux-build-and-check",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "build",
        "--secret",
        "id=build-env,src=.env.production",
        "--target",
        "build",
        "-t",
        "ci-check:$BUILD_ID",
        "-f",
        "Dockerfile.v2",
        "."
      ],
      "env": [
        "DOCKER_BUILDKIT=1"
      ]
    },
    {
      "id": "unit-tests",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "run",
        "--rm",
        "--env",
        "AUTH_SECRET=gcp-ci-unit-test-secret-not-a-runtime-credential",
        "ci-check:$BUILD_ID",
        "sh",
        "-ec",
        "rm -f .env .env.*; node --test scripts/schema-readiness.check.cjs scripts/check-idempotency-recovery.mjs scripts/check-account-contract.mjs && npm test && npm run typecheck"
      ]
    },
    {
      "id": "financial-postgres-tests",
      "name": "gcr.io/cloud-builders/docker",
      "entrypoint": "sh",
      "args": [
        "-ec",
        "docker run -d --rm --name financial-db -e POSTGRES_PASSWORD=financial-test-only postgres:17; trap \"docker stop financial-db\" EXIT; for i in $$(seq 1 60); do docker exec financial-db pg_isready -U postgres && break; sleep 1; done; docker exec -i financial-db psql -v ON_ERROR_STOP=1 -U postgres < scripts/create-tables.sql; docker exec -i financial-db psql -v ON_ERROR_STOP=1 -U postgres < scripts/security-rate-limits.sql; docker run --rm --network container:financial-db -e DATABASE_URL=postgres://postgres:financial-test-only@127.0.0.1:5432/postgres ci-check:$BUILD_ID sh -ec \"rm -f .env .env.*; npm test\""
      ]
    },
    {
      "id": "install-schema-proxy",
      "name": "gcr.io/cloud-builders/docker",
      "entrypoint": "sh",
      "args": [
        "-ec",
        "docker create --name schema-proxy-binary gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.0 >/dev/null; trap \"docker rm -f schema-proxy-binary >/dev/null\" EXIT; docker cp schema-proxy-binary:/cloud-sql-proxy /workspace/.ci-cloud-sql-proxy; chmod 755 /workspace/.ci-cloud-sql-proxy"
      ]
    },
    {
      "id": "active-source-schema-readiness",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "run",
        "--rm",
        "--network",
        "cloudbuild",
        "-v",
        "/workspace/.env.production:/run/secrets/build-env:ro",
        "-v",
        "/workspace/.ci-cloud-sql-proxy:/run/cloudsql-proxy:ro",
        "ci-check:$BUILD_ID",
        "node",
        "scripts/schema-readiness.cjs",
        "tollbooth"
      ]
    },
    {
      "id": "runtime-image",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "build",
        "--secret",
        "id=build-env,src=.env.production",
        "-t",
        "us-west1-docker.pkg.dev/$PROJECT_ID/ci-tollbooth-v2/tollbooth-v2:${_TAG}-$BUILD_ID",
        "-f",
        "Dockerfile.v2",
        "."
      ],
      "env": [
        "DOCKER_BUILDKIT=1"
      ]
    },
    {
      "id": "export-runtime-layers",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "save",
        "-o",
        ".ci-image.tar",
        "us-west1-docker.pkg.dev/$PROJECT_ID/ci-tollbooth-v2/tollbooth-v2:${_TAG}-$BUILD_ID"
      ]
    },
    {
      "id": "verify-no-secret-layers",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "python3",
      "args": [
        "scripts/gcp-scan-image.py",
        ".ci-image.tar",
        ".env.production"
      ]
    },
    {
      "id": "remove-build-inputs",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "bash",
      "args": [
        "-ec",
        "rm -f .ci-image.tar .env.production .ci-cloud-sql-proxy"
      ]
    },
    {
      "id": "push-image",
      "name": "gcr.io/cloud-builders/docker",
      "args": [
        "push",
        "us-west1-docker.pkg.dev/$PROJECT_ID/ci-tollbooth-v2/tollbooth-v2:${_TAG}-$BUILD_ID"
      ]
    },
    {
      "id": "release",
      "name": "gcr.io/google.com/cloudsdktool/cloud-sdk:slim",
      "entrypoint": "bash",
      "args": [
        "-c",
        "set -euo pipefail\nimage='us-west1-docker.pkg.dev/$PROJECT_ID/ci-tollbooth-v2/tollbooth-v2:${_TAG}-$BUILD_ID'\ndigest=$(gcloud artifacts docker images describe \"$$image\" --format='value(image_summary.digest)')\nexport CI_SERVICE='tollbooth-v2' CI_BUILD_ID='$BUILD_ID' CI_IMAGE=\"$${image%:*}@$$digest\"\npython3 scripts/gcp-release.py\n"
      ]
    }
  ],
  "images": [
    "us-west1-docker.pkg.dev/$PROJECT_ID/ci-tollbooth-v2/tollbooth-v2:${_TAG}-$BUILD_ID"
  ],
  "options": {
    "machineType": "E2_HIGHCPU_8",
    "logging": "CLOUD_LOGGING_ONLY"
  },
  "timeout": "1800s"
}
